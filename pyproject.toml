[project]
name = "spacedeck"
version = "0.1.3"
description = "Spaced review over your course notes — a Claude Code plugin"
requires-python = ">=3.13"
dependencies = []
readme = "README.md"
license = { text = "MIT" }
keywords = ["spaced-repetition", "study", "claude-code", "flashcards"]

[project.scripts]
spacedeck = "spacedeck.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spacedeck"]
